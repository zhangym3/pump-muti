[platformio]
default_envs = pump_master

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
; ESP32-S3-WROOM-1 N16R8: 16MB quad flash; PSRAM is not required.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.f_flash = 40000000L
framework = espidf
extra_scripts = pre:tools/mesh_sdk_build.py
upload_port = COM5
monitor_port = COM5
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -std=gnu++17

[env:pump_master]
build_flags = ${env.build_flags}
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.master.defaults


; Bench candidate: five valves overlap; not a hardware-accepted production release.
[env:pump_master_five_candidate]
extends = env:pump_master
build_flags = ${env.build_flags} -DPUMP_MAX_CONCURRENT=5
