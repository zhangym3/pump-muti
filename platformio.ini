[platformio]
default_envs = pump_master

[env]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
; ESP32-C3 Super Mini: 4MB flash, native USB Serial/JTAG.
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.flash_mode = dio
board_build.f_flash = 40000000L
framework = espidf
extra_scripts = pre:tools/mesh_sdk_build.py
upload_port = COM9
monitor_port = COM9
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = partitions.csv
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -std=gnu++17

[env:pump_master]
build_flags = ${env.build_flags}
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.master.defaults

; Receive/handshake diagnosis: SDK debug is enabled during scans and provisioning.
; Uses its own build/config directory; does not replace the packaged release.
[env:pump_master_discovery_diag]
extends = env:pump_master
build_flags = ${env.build_flags} -DPUMP_DISCOVERY_TRACE=1 -DPUMP_SAR_DIAGNOSTICS=1
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.master.defaults;sdkconfig.discovery.defaults

; A/B diagnosis only: retain phone advertising, disable Mesh scan deduplication.
[env:pump_master_discovery_no_dup]
extends = env:pump_master_discovery_diag
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.master.defaults;sdkconfig.discovery.defaults;sdkconfig.discovery_nodup.defaults

[env:pump_master_discovery_data_device]
extends = env:pump_master_discovery_diag
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.master.defaults;sdkconfig.discovery.defaults;sdkconfig.discovery_data_device.defaults


; Bench candidate: five valves overlap; not a hardware-accepted production release.
[env:pump_master_five_candidate]
extends = env:pump_master
build_flags = ${env.build_flags} -DPUMP_MAX_CONCURRENT=5
