[platformio]
default_envs = pump_master

[env:pump_master]
; 工具链与主控：ESP32-S3-WROOM-1 N16R8，不启用 PSRAM。
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = espidf

; 16MB Flash，DIO / 40MHz；应用容量由 partitions.csv 限制。
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.partitions = partitions.csv

; 构建前准备项目本地 Mesh SDK 补丁，并生成构建标识。
extra_scripts = pre:tools/mesh_sdk_build.py
build_flags = -std=gnu++17

; 通过 CMake 加载基础配置和主节点配置；已有 sdkconfig.pump_master 的值优先。
; 默认要求 PIN 认证；恢复管理还需独立的可信安装凭证。
; 不得通过启用 CONFIG_PUMP_DEV_NO_PIN 绕过配对或恢复管理认证。
; 业务并发沿用 include/board_profile.h 的默认值 1。
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.master.defaults

; 上传和日志使用已确认的主设备端口 COM8。
; 端口变化时通过 --upload-port / --port 指定实际端口。
; UART0：TX=GPIO43、RX=GPIO44；打开监视器时不切换 DTR/RTS。
upload_port = COM7
monitor_port = COM7
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
